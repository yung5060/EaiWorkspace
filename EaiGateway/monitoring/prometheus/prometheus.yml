global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'eai-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eaigateway:32080']

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eaiconfig:8888']
